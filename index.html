<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Jeopardy </title>
    <style>
        body {
            background-color: #060ce9;
            color: white;
            font-family: 'Arial Black', 'SimHei', 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            border: 8px solid #ffcc00;
            padding: 40px;
            width: 90%;
            max-width: 1000px;
            background: #060ce9;
            box-shadow: 15px 15px 0px #000;
            position: relative;
        }

        #score-tag {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2.5rem;
            color: #ffcc00;
            font-weight: 900;
            text-shadow: 3px 3px 0px #000;
            border: 4px solid #ffcc00;
            padding: 5px 15px;
            background: rgba(0,0,0,0.3);
        }

        .category {
            font-size: 1.4rem;
            color: #ffcc00;
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 4px;
            border-bottom: 3px solid #ffcc00;
            display: inline-block;
            padding: 0 20px 5px 20px;
        }

        #question {
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1.3;
            margin-bottom: 40px;
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 4px 4px 0px #000;
        }

        #answer {
            font-size: 2rem;
            color: #ffcc00;
            background-color: #000;
            visibility: hidden;
            margin-top: 20px;
            padding: 20px;
            border: 3px solid white;
            box-shadow: inset 0 0 15px #ffcc00;
        }

        .controls {
            margin-top: 40px;
        }

        button {
            background-color: #ffcc00;
            border: 3px solid #fff;
            color: #060ce9;
            padding: 18px 45px;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            margin: 10px;
            box-shadow: 5px 5px 0px #000;
            transition: 0.1s;
        }

        button:hover { background-color: #fff; transform: scale(1.02); }
        button:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0px #000; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-tag">$500</div>
    <div class="category" id="category-display">领域：未定义</div>
    <div id="question">准备好解析现实了吗？</div>
    <div id="answer">-</div>

    <div class="controls">
        <button onclick="revealAnswer()">揭晓真相</button>
        <button onclick="generateQuestion()">跳跃维度</button>
    </div>
</div>

<script>
    const abstractData = {
        categories: [
            "虚无主义收纳术", "非欧几何家政学", "赛博乡愁", "热力学第二定律的借口",
            "克苏鲁的PPT模版", "修辞学末日", "人工智能的偏头痛", "反物质厨艺",
            "高维度财务纠纷", "碳基生物逻辑盲区", "午夜三点的形而上学", "过期因果处理",
            "量子态社交恐惧", "无效办公指南", "平行时空的户口本", "不存在的行政处罚"
        ],
        templates: [
            { q: "你会{verbing}吗？", a: "N/A。在{place}，这被视为一种{concept}。"},
            { q: "{subject}和{subject2}之间，谁更具有{concept}？", a: "取决于谁在{time}持有那半个{object}。"},
            { q: "如果{entity}在{time}试图{action}，你该怎么办？", a: "保持{emotion}，并立刻将{object}丢进{place}。"},
            { q: "请解释为什么{place}没有{object}？", a: "因为根据{concept}，它们已经全部转化为{number}个{subject}。"},
            { q: "在{time}，{subject}是否具备{verbing}的资格？", a: "只有当它的{part}被彻底{action_past}之后。"},
            { q: "{entity}的影子通常呈现什么形状？", a: "一种类似于{emotion}感的{concept}结构。"},
            { q: "当{subject}遇见{entity}，空气中会弥漫什么味道？", a: "一股被{action_past}过的{object}味。"},
            { q: "如何用{number}个字形容{concept}？", a: "“{object}在{place}{verbing}”。"},
            { q: "如果你的{part}突然变成了{object}，你会选择？", a: "我会选择在{time}通过{action}来弥补。"},
            { q: "是谁在{place}里偷走了{subject}？", a: "是你那尚未出生的{entity}，它想用它交换{number}份{concept}。"},
            { q: "计算：{number}个{object} + {number2}个{subject} = ?", a: "结果是：在{place}发生的一场{concept}。"},
            { q: "若{entity}在{time}向你索要{object}，你会？", a: "立刻{action}并表现出{emotion}。"},
            { q: "在这个{place}，{verbing}是非法的吗？", a: "法律在这里是{concept}态，取决于{subject}的颜色。"},
            { q: "为什么{subject}在{time}看起来像{object}？", a: "因为观察者的{part}已经严重{concept}化了。"},
            { q: "如果你被{action_past}了，你的{part}会去哪？", a: "它会变成{place}里的一个{object}。"},
            { q: "这道题的答案是(A){object} (B){entity} (C){concept} (D)以上都不是？", a: "正确答案是：{number}个正在{action}的{subject}。"}
        ],
        words: {
            time: ["大爆炸前五秒", "周三与周四的裂缝", "工资到账前", "光速变慢的瞬间", "最后一个冰河期", "永恒的午后", "所有闹钟停止时", "公元前0.5年", "你犹豫的瞬间", "由于天气取消的明天", "第二次文艺复兴前夕"],
            entity: ["穿燕尾服的乌贼", "你的第二人格", "拒绝进化的仙人掌", "平行时空收银员", "会跳舞的质子", "过期的数字灵魂", "隐藏在字典里的刺客", "写代码的猫", "没有任何属性的NPC", "装满沉默的瓶子", "名为“错误”的实体", "被降职的爱神"],
            action: ["重构宇宙代码", "离线升级DNA", "涂抹现实边缘", "解析云的潜意识", "删除昨天缓存", "与虚无谈判", "翻译风的呼吸", "给黑洞安装补丁", "在虚数空间垂钓", "寻找逻辑尽头", "申请物理定律豁免"],
            action_past: ["格式化", "降维打击", "煮成逻辑汤", "折叠成五角星", "翻译成乱码", "质押给未来", "当作垃圾分类", "被腌制", "被静音", "被拖入回收站"],
            object: ["半个圆周率", "电子羊的梦", "生锈的直觉", "404错误残骸", "一克寂静", "过期通行证", "无主公钥", "一打叹息", "丢掉的密码", "半截消失的梯子", "恐社夸克", "未完成的悔过书"],
            subject: ["你的影子", "这行代码", "绝对零度", "达芬奇草稿", "还没洗的袜子", "因果律漏洞", "被遗忘的单词", "宇宙备忘录", "此时的直觉", "你丢失的睡眠", "昨天的天气预报"],
            subject2: ["薛定谔的盒饭", "前任的逻辑", "没信号的WiFi", "还没发生的灾难", "空气几何学", "宇宙底色", "问题本身", "被屏蔽的关键帧"],
            concept: ["莫比乌斯尴尬", "低级审美趣味", "量子态犹豫", "数字化乡愁", "熵减幻觉", "多维违章建筑", "不可名状空虚", "语义缓慢死亡", "逻辑回光返照", "系统错误", "纯粹理性发酵"],
            part: ["审美阈值", "逻辑死角", "右侧灵魂", "发际线", "记忆备份", "多余道德感", "重力依赖", "童年滤镜", "分辨真伪的嗅觉", "碳基自尊心"],
            place: ["回收站底层", "书页缝隙", "没信号的电梯", "潜意识后厨房", "某人备注栏", "黑洞边缘", "过期彩票里", "大脑盲区", "未渲染贴图后", "五维空间垃圾场", "某份合同的免责声明里"],
            verbing: ["呼吸数字化", "解析星光", "交易梦境", "给黑洞打包", "计算云的重量", "离线升级", "真空中游泳", "编织因果", "对抗热寂", "原地递归", "进行碳基呼吸"],
            number: ["√-1", "42", "趋近零的无穷", "0.333个", "一打半", "e的iπ次方", "九分之八个", "无法计算常数", "刚好引起爆炸的份量", "负无穷大"],
            number2: ["2048", "1.618", "一万个", "0.00001", "半个", "七又三分之二"],
            emotion: ["电子忧伤", "理智狂喜", "像素化迷茫", "无氧宁静", "很新的疲惫", "无法导出的愤怒", "跨维度思乡", "自洽导致的舒适", "一种极其礼貌的绝望"]
        }
    };

    function getRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateQuestion() {
        // 随机分值
        const scores = [100, 200, 300, 400, 500, 800, 1000];
        document.getElementById('score-tag').innerText = "$" + getRandom(scores);

        const template = getRandom(abstractData.templates);
        let qText = template.q;
        let aText = template.a;

        const regex = /\{([^}]+)\}/g;
        const currentContext = {};

        const finalQ = qText.replace(regex, (match, key) => {
            if(!currentContext[key]) currentContext[key] = getRandom(abstractData.words[key]);
            return currentContext[key];
        });
        
        const finalA = aText.replace(regex, (match, key) => {
            return currentContext[key] || getRandom(abstractData.words[key]);
        });

        document.getElementById('category-display').innerText = "领域：" + getRandom(abstractData.categories);
        document.getElementById('question').innerText = finalQ;
        document.getElementById('answer').innerText = finalA;
        document.getElementById('answer').style.visibility = 'hidden';
    }

    function revealAnswer() {
        document.getElementById('answer').style.visibility = 'visible';
    }

    window.onload = generateQuestion;
</script>

</body>
</html>
